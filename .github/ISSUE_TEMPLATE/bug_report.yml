name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not use this form for suspected security vulnerabilities.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction you can.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Host and isolation backend
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
