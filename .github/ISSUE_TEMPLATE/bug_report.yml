name: Bug report
description: Report reproducible non-security incorrect behavior
title: "bug: "
labels: [bug, "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for suspected security vulnerabilities. Report sandbox escapes,
        authorization bypasses, key exposure, content-boundary bypasses, runtime-integrity
        failures, and false authoritative evidence through
        [private vulnerability reporting](https://github.com/Shrimpworks/capsule-corp/security/advisories/new).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Select the narrowest component that exhibits the problem.
      options:
        - Agent-facing daemon
        - Approval Broker
        - Execution Supervisor
        - Runtime
        - Isolation backend or guest
        - Protocol or schema
        - Storage, recovery, or evidence
        - Installation or update
        - Documentation or tooling
        - Unknown or cross-component
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction you can.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Host and isolation backend
      description: Include OS version, architecture, and the exact backend or fake harness.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and evidence
      description: Include bounded logs, test names, or artifact digests. Remove credentials and private content.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Security-boundary impact
      description: Which authority, isolation, content, integrity, or evidence property may be affected? Write "none known" when applicable.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safe disclosure
      options:
        - label: I removed secrets, credentials, private user content, and unsafe exploit details.
          required: true
        - label: This report is confined to Capsule repository fixtures, local harnesses, or an explicitly authorized owned environment.
          required: true
