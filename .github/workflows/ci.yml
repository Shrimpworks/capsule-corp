name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly run of the full (non -short) Go suite, including the
    # disk-backed 64-segment archive-activation pipeline that the PR-gating
    # `go` job below skips via -short to stay fast. See issue #316.
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiled-artifact-archive:
    name: Compiled artifact archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch and verify immutable archive
        run: ./scripts/verify-compiled-artifact-archive-remote.sh

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so golangci-lint's only-new-issues (below) can diff
          # against the PR base commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          # revive's exported/package-comments rules (issue #217) have a
          # repository-wide backlog (~825 pre-existing findings) that is
          # tracked and remediated separately, not blocked on here.
          # only-new-issues restricts every enabled linter's gate to lines
          # touched by the current change; for the other linters, which
          # already have zero repository-wide findings, this is a no-op.
          only-new-issues: true

      - name: Vulnerability scan
        env:
          # This pinned govulncheck version requires a newer Go than go.mod
          # pins for the project itself; let `go run` fetch a matching
          # toolchain just for this tool instead of restricting it to the
          # local one.
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test
        # -short skips the slow disk-backed 64-segment archive-activation
        # pipeline (~1 min alone); the `go-full-suite` job below runs the
        # complete suite nightly instead. See issue #316.
        run: go test -short -cover ./...

      - name: Build
        run: go build ./...

  go-full-suite:
    name: Go (full suite, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (full, no -short)
        run: go test -cover ./...

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the exported-JSDoc gate below can diff against
          # the PR base commit; the other steps in this job don't need it.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project site
        run: pnpm site:build

      - name: Validate schemas
        run: pnpm verify:schemas

      - name: Validate ADR index
        run: pnpm verify:adrs

      - name: Check
        run: pnpm check

      - name: Check formatting and lint
        run: pnpm lint

      - name: Verify exported JSDoc on changed files
        # New-code-only gate (issue #217): the existing repository-wide
        # backlog is tracked separately, not blocked on here. Only runs on
        # pull_request, where a stable base commit is available to diff
        # against.
        if: github.event_name == 'pull_request'
        run: |
          changed=()
          while IFS= read -r path; do
            changed+=("$path")
          done < <(git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}"...HEAD -- 'packages/**/*.ts' 'packages/**/*.tsx' | grep -v '\.test\.tsx\?$' || true)
          if [ ${#changed[@]} -eq 0 ]; then
            echo "no changed TypeScript source files"
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          node scripts/verify-exported-jsdoc.mjs "${changed[@]}"

      - name: Test
        run: pnpm test

      - name: Test coverage (informational)
        run: pnpm --recursive exec -- sh -c 'node --experimental-test-coverage --test dist/*.test.js'
        continue-on-error: true

      - name: Build
        run: pnpm build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
