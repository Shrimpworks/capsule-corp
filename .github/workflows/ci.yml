name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Vulnerability scan
        env:
          # govulncheck@latest requires a newer Go than go.mod pins for the
          # project itself; let `go run` fetch a matching toolchain just for
          # this tool instead of restricting it to the local one.
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test -cover ./...

      - name: Build
        run: go build ./...

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project site
        run: pnpm site:build

      - name: Validate schemas
        run: pnpm verify:schemas

      - name: Validate ADR index
        run: pnpm verify:adrs

      - name: Check
        run: pnpm check

      - name: Check formatting and lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test coverage (informational)
        run: pnpm --recursive exec -- sh -c 'node --experimental-test-coverage --test dist/*.test.js'
        continue-on-error: true

      - name: Build
        run: pnpm build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
